<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <title>Listagem de Clientes</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link th:href="@{/css/styleListaClientes.css}" rel="stylesheet">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
              integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>

    <body>
        <nav class="navbar navbar-custom" data-bs-theme="dark">
            <div class="container-fluid">
                <a class="navbar-brand" th:href="@{/}">
                    <img th:src="@{/img/logoSorveteria.jpg}" alt="Logo da sorveteria Ice Vanilla" width="55" height="30"
                         class="d-inline-block align-text-top" />
                    <span class="text">Ice Vanilla</span>
                </a>
            </div>
        </nav>

        <div class="container my-5">

            <h2 class="text-custom">Listagem de Clientes</h2>
            <h6>Abaixo você pode conferir os dados dos clientes cadastrados.</h6>

            <table class="table table-striped table-bordered mt-4">
                <thead class="table-primary">
                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Cpf</th>
                        <th>Telefone</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cliente : ${clientes}">
                        <td th:text="${cliente.nome}"></td>
                        <td th:text="${cliente.email}"></td>
                        <td th:text="${cliente.cpf}"></td>
                        <td th:text="${cliente.telefone}"></td>

                        <td>
                            <a th:href="@{/clientes/{id}/editar(id=${cliente.id})}" 
                               class="btn btn-info btn-sm me-2">Atualizar</a>

                            <a th:href="@{/clientes/{id}/excluir(id=${cliente.id})}" 
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Tem certeza que deseja excluir este cliente?');">Excluir</a>
                        </td>
                    </tr>

                    <tr th:if="${clientes.empty}">
                        <td colspan="5">Nenhum cliente cadastrado.</td>
                    </tr>
                </tbody>
            </table>
            <div class="d-flex gap-2 mb-3">
                <a th:href="@{/clientes/novo}" class="btn btn-warning">Novo Cliente</a>
                <a th:href="@{/}" class="btn btn-secondary">Voltar</a>
            </div>
        </div>

        <nav class="navbar navbar-custom mt-5" data-bs-theme="dark">
            <div class="container-fluid">
                <a class="navbar-brand" th:href="@{/}">
                    <img th:src="@{/img/logoSorveteria.jpg}" alt="Logo da sorveteria Ice Vanilla" width="55" height="30"
                         class="d-inline-block align-text-top" />
                </a>
                <div class="p-custom">
                    <p>Todos os direitos reservados ©</p>
                </div>
            </div>
        </nav>
    </body>
</html>

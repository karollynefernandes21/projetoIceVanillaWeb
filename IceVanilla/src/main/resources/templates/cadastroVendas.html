<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <title>Cadastro de Vendas</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link th:href="@{/css/styleCadastroVendas.css}" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
              integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>

    <body>
        <nav class="navbar navbar-custom" data-bs-theme="dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <img th:src="@{/img/logoSorveteria.jpg}" alt="Logo da sorveteria Ice Vanilla" width="55" height="30"
                         class="d-inline-block align-text-top" />
                    <span class="text">Ice Vanilla</span>
                </a>
            </div>
        </nav>

        <div class="container my-5">
            <div class="row justify-content-center">
                <div class="col-lg-10 venda-card">

                    <!-- Formulário mapeado para o VendaFormDTO -->
                    <form th:action="@{/vendas/salvar}" th:object="${vendaForm}" method="post">

                        <div class="row">
                            <div class="col-md-7 border-end pe-4">

                                <!-- Seção de cliente -->
                                <h5 class="mb-3">Cliente</h5>
                                <div class="input-group mb-3">
                                    <!-- Select de clientes mapeado para VendaFormDTO.clienteId -->
                                    <select class="form-select" id="clienteSelect" th:field="*{clienteId}" required>
                                        <option value="">Selecione um Cliente</option>
                                        <option th:each="cliente : ${clientes}" th:value="${cliente.id}" th:text="${cliente.nome}"></option>
                                    </select>
                                    <a th:href="@{/clientes/novo}" class="btn btn-warning">+ Novo Cliente</a>
                                </div>
                                <p class="border p-2 bg-light rounded">
                                    Cliente Selecionado: <span id="clienteNomeDisplay">Nenhum</span>
                                </p>

                                <!-- Seção para adicionar itens -->
                                <h5 class="mb-3 mt-4">Adicionar Item</h5>
                                <div class="input-group mb-3">
                                    <!-- Select de sorvetes -->
                                    <select class="form-select" id="sorveteSelect">
                                        <option value="">Buscar Sorvete...</option>
                                        <option th:each="sorvete : ${sorvetes}" 
                                                th:value="${sorvete.id}" 
                                                th:text="${sorvete.sabor}"></option>
                                    </select>
                                    <!-- Campo de quantidade para o JS obter o valor -->
                                    <input type="number" class="form-control" id="quantidadeItem" value="1" min="1" style="max-width: 80px;">

                                    <button class="btn btn-warning" type="button" id="adicionarItemButton">Adicionar</button>
                                </div>

                                <!-- Tabela de itens -->
                                <div class="table-responsive">
                                    <table class="table table-striped align-middle">
                                        <thead class="table-light">
                                            <tr>
                                                <th>Sorvete</th>
                                                <th>Quantidade</th>
                                                <th>Preço Unitário</th>
                                                <th>Subtotal</th>
                                                <th></th>
                                            </tr>
                                        </thead>
                                        <!-- ID para onde o JavaScript vai injetar as linhas -->
                                        <tbody id="itensVendaBody">
                                            <tr>
                                                <td colspan="5" class="text-center">Adicione sorvetes acima para iniciar a venda.</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>

                                <!-- Seção de forma de pagamento -->
                                <h5 class="mb-3 mt-4">Forma de Pagamento</h5>
                                <div class="btn-group mb-4" role="group" aria-label="Formas de Pagamento">
                                    <select class="form-select" th:field="*{formaPagamento}" required>
                                        <option value="">Selecione a Forma de Pagamento</option>
                                        <option value="CARTAO_CREDITO">Cartão de Crédito</option>
                                        <option value="DEBITO">Débito</option>
                                        <option value="DINHEIRO">Dinheiro</option>
                                        <option value="PIX">PIX</option>
                                    </select>
                                </div>

                                <!-- Botão de finalizar a venda -->
                                <button class="btn btn-warning btn-lg w-100" type="submit">Finalizar Venda</button>

                            </div>

                            <!-- Resumo da venda -->
                            <div class="col-md-5 ps-4">
                                <h5 class="mb-3">Resumo da Venda</h5>

                                <ul class="list-group list-group-flush mb-3">
                                    <li class="list-group-item d-flex justify-content-between align-items-center">
                                        Subtotal
                                        <!-- ID que vai ser atualizado pelo JS -->
                                        <span class="fw-bold" id="displaySubtotal">R$ 0,00</span>
                                    </li>
                                    <li class="list-group-item d-flex justify-content-between align-items-center bg-light">
                                        <span class="fw-bold">Valor Total</span>
                                        <!-- ID que vai ser atualizado pelo JS -->
                                        <span class="fw-bold fs-5 text-primary" id="displayTotal">R$ 0,00</span>
                                    </li>
                                </ul>

                                <input type="hidden" name="valorTotal" id="inputValorTotal" value="0.00"/>

                            </div>
                        </div>
                    </form>

                </div>
            </div>
            <!-- Botão de voltar -->
            <a th:href="@{/vendas/lista}" class="btn btn-secondary mt-4">Voltar</a>
        </div>

        <!-- Footer -->
        <nav class="navbar navbar-custom mt-5" data-bs-theme="dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <img th:src="@{/img/logoSorveteria.jpg}" alt="Logo da sorveteria Ice Vanilla" width="55" height="30"
                         class="d-inline-block align-text-top" />
                </a>
                <div class="p-custom">
                    <p>Todos os direitos reservados ©</p>
                </div>
            </div>
        </nav>

        <script th:src="@{/js/vendas.js}"></script>
    </body>

<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Listagem de Detalhes de Venda</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link th:href="@{/css/styleDetalhesVenda.css}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        xintegrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <nav class="navbar navbar-custom" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img th:src="@{/img/logoSorveteria.jpg}" alt="Logo da sorveteria Ice Vanilla" width="55" height="30"
                    class="d-inline-block align-text-top" />
                <span class="text">Ice Vanilla</span>
            </a>
        </div>
    </nav>

    <div class="container my-5">

        <h2 class="text-custom" th:text="'Detalhes da Venda #' + ${venda.id}">Listagem de Detalhes de uma Venda</h2>
        <h6>Abaixo você pode conferir os detalhes da venda escolhida.</h6>

        <div class="card my-4">
            <div class="card-header">
                Resumo da Venda
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-4">
                        <strong>Cliente:</strong>
                        <p th:text="${venda.cliente.nome}"></p>
                    </div>
                    <div class="col-md-4">
                        <strong>Data/Hora:</strong>
                        <p th:text="${#temporals.format(venda.dataHora, 'dd/MM/yyyy HH:mm')}"></p>
                    </div>
                    <div class="col-md-4">
                        <strong>Valor Total:</strong>
                        <p class="fw-bold fs-5" th:text="${#numbers.formatCurrency(venda.valorTotal)}">R$ 0,00</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabela de Itens da Venda -->
        <div class="table-responsive">
            <table class="table table-striped table-bordered mt-4 align-middle">
                <thead class="table-primary">
                    <tr>
                        <th>Sorvete</th>
                        <th>Quantidade</th>
                        <th>Preço Unitário</th>
                        <th>Subtotal</th>
                    </tr>
                </thead>
                <tbody id="corpo-tabela-detalhes">
                    
                    <tr th:each="item : ${venda.itens}">
                        <td th:text="${item.sorvete.sabor}"></td>
                        <td th:text="${item.quantidade}"></td>
                        <td th:text="${#numbers.formatCurrency(item.precoUnitario)}"></td>
                        <td th:text="${#numbers.formatCurrency(item.subtotal)}"></td>
                    </tr>

                    <tr th:if="${venda.itens.empty}">
                        <td colspan="4" class="text-center">Esta venda não possui itens registrados.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <a th:href="@{/vendas/lista}" class="btn btn-secondary">Voltar</a>
    </div>

    <!-- Footer -->
    <nav class="navbar navbar-custom mt-5" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img th:src="@{/img/logoSorveteria.jpg}" alt="Logo da sorveteria Ice Vanilla" width="55" height="30"
                    class="d-inline-block align-text-top" />
            </a>
            <div class="p-custom">
                <p>Todos os direitos reservados ©</p>
            </div>
        </div>
    </nav>
</body>
</html>
